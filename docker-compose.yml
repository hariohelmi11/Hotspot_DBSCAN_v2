version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: hotspot_db
    environment:
      POSTGRES_DB: hotspot_db
      POSTGRES_USER: hotspot_user
      POSTGRES_PASSWORD: hotspot_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotspot_user -d hotspot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotspot_backend
    environment:
      DATABASE_URL: postgresql://hotspot_user:hotspot_pass@db:5432/hotspot_db
      SECRET_KEY: change-this-secret-key-in-production
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotspot_frontend
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: hotspot_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
